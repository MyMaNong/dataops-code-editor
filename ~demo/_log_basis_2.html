<!DOCTYPE html><html><head><title>Rsbuild App</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script defer src="/~demo/static/js/lib-react.a5a83cb0df.js"></script><script defer src="/~demo/static/js/7112.6cd9958288.js"></script><script defer src="/~demo/static/js/3640.3e84016771.js"></script><script defer src="/~demo/static/js/2331.d45f8481ca.js"></script><script defer src="/~demo/static/js/4034.b5d8f52f96.js"></script><script defer src="/~demo/static/js/6620.3046afe5e8.js"></script><script defer src="/~demo/static/js/3535.3752457892.js"></script><script defer src="/~demo/static/js/9168.5c683d40b9.js"></script><script defer src="/~demo/static/js/5959.6305b1d3f2.js"></script><script defer src="/~demo/static/js/9099.6ece6fc5f3.js"></script><script defer src="/~demo/static/js/8426.12100e25fa.js"></script><script defer src="/~demo/static/js/_log_basis_2.3bd03ad93d.js"></script><link href="/~demo/static/css/9099.47f64f3115.css" rel="stylesheet"><script>const storageKey = 'rspress-plugin-preview-theme-appearance';

function setDocumentTheme(isDark) {
  if (isDark) {
    document.documentElement.classList.add('dark');
    document.documentElement.style.colorScheme = 'dark';
  } else {
    document.documentElement.classList.remove('dark');
    document.documentElement.style.colorScheme = 'light';
  }
  localStorage.setItem(
    'rspress-plugin-preview-theme-appearance',
    isDark ? 'dark' : 'light',
  );
}

const saved = localStorage.getItem(storageKey) || 'light';
setDocumentTheme(saved === 'dark');

window.addEventListener('message', event => {
  if (event.data.type === 'theme-change') {
    const isDark = event.data.dark;
    setDocumentTheme(isDark);
  }
});
</script></head><body><div id="root"></div></body></html>
