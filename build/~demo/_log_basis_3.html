<!DOCTYPE html><html><head><title>Rsbuild App</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><script defer src="/~demo/static/js/lib-react.3c8f7b4ae9.js"></script><script defer src="/~demo/static/js/9197.b1ae937b3c.js"></script><script defer src="/~demo/static/js/9832.87a92893f1.js"></script><script defer src="/~demo/static/js/6063.1fc5762b3a.js"></script><script defer src="/~demo/static/js/6734.838746d96f.js"></script><script defer src="/~demo/static/js/4664.ddb2ca83f6.js"></script><script defer src="/~demo/static/js/5519.2b37e5a4ea.js"></script><script defer src="/~demo/static/js/4684.3fb70c1cc5.js"></script><script defer src="/~demo/static/js/163.b41442d5e7.js"></script><script defer src="/~demo/static/js/524.a035b38185.js"></script><script defer src="/~demo/static/js/6502.be1f180e06.js"></script><script defer src="/~demo/static/js/_log_basis_3.c76e00da2f.js"></script><link href="/~demo/static/css/524.47f64f3115.css" rel="stylesheet"><script>const storageKey = 'rspress-plugin-preview-theme-appearance';

function setDocumentTheme(isDark) {
  if (isDark) {
    document.documentElement.classList.add('dark');
    document.documentElement.style.colorScheme = 'dark';
  } else {
    document.documentElement.classList.remove('dark');
    document.documentElement.style.colorScheme = 'light';
  }
  localStorage.setItem(
    'rspress-plugin-preview-theme-appearance',
    isDark ? 'dark' : 'light',
  );
}

const saved = localStorage.getItem(storageKey) || 'light';
setDocumentTheme(saved === 'dark');

window.addEventListener('message', event => {
  if (event.data.type === 'theme-change') {
    const isDark = event.data.dark;
    setDocumentTheme(isDark);
  }
});
</script></head><body><div id="root"></div></body></html>
